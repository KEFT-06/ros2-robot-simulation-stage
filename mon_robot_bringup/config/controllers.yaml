controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters: {}

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint1_head
      - joint2_rotor

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    action_monitor_rate: 20.0

    allow_partial_joints_goal: false
    open_loop_control: false

    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 5.0
      joint1_head:
        trajectory: 0.05
        goal: 0.05
      joint2_rotor:
        trajectory: 0.05
        goal: 0.05

    # Pas de bloc 'gains' : avec une command_interface 'position', le
    # JointTrajectoryController transmet les positions directement et ignore
    # tout PID. (Ajouter 'gains' seulement si on passe a une interface effort.)
